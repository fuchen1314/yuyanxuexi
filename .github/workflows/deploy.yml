name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      # 子路径部署：根据仓库名设置 base（用户名为 REPO_OWNER，仓库名为 REPO_NAME）
      # 如果仓库名是 <owner>.github.io，base 为 /，否则为 /<repo>/
      - name: Set base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "BASE=/" >> $GITHUB_ENV
          else
            echo "BASE=/${REPO}/" >> $GITHUB_ENV
          fi
      - name: Build
        run: npm run build -- --base=$BASE
      # 修正 manifest 的 start_url / scope 为实际部署路径
      - name: Fix manifest paths
        run: |
          if [ "$BASE" = "/" ]; then
            sed -i 's|"start_url": "./"|"start_url": "/"|' dist/manifest.json
            sed -i 's|"scope": "./"|"scope": "/"|' dist/manifest.json
          else
            sed -i "s|\"start_url\": \"./\"|\"start_url\": \"$BASE\"|" dist/manifest.json
            sed -i "s|\"scope\": \"./\"|\"scope\": \"$BASE\"|" dist/manifest.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
